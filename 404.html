<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Engineering Notes moved</title>
    <script>
      (function () {
        var base = "/engineering-notes";
        var path = window.location.pathname || "/";

        if (path === base) {
          path = "/";
        } else if (path.indexOf(base + "/") === 0) {
          path = path.slice(base.length);
        }

        if (!path || path.charAt(0) !== "/") {
          path = "/" + path;
        }

        location.replace("https://oojjrs.github.io" + path + window.location.search + window.location.hash);
      }());
    </script>
  </head>
  <body>
    <p>Engineering Notes moved to <a href="https://oojjrs.github.io/">oojjrs.github.io</a>.</p>
  </body>
</html>
